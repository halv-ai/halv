<!--
  Halv visual QA states (select with ?state=):

  connect-gate
  connect-gate-pending
  connect-gate-failed
  connect-gate-keys
  first-run-fresh
  first-run-codex
  chat-not-connected
  chat-active
  savings-dashboard
  paywall
  account-gate

  Example:
    /ux-audit.html?state=connect-gate

  Legacy UX audit scenarios remain available with ?scenario=:

  normal (default)
    Signed-in Pro account, healthy managed Headroom proxy, realistic savings,
    model catalog, projects, rich conversation history, and streaming chat.

  fresh
    Halv account is valid but ChatGPT credentials are signed out. Conversation
    history is empty and Headroom moves from not installed to installing after
    two seconds, streams install progress, then reaches running.

  usage-limit
    Healthy signed-in state, but chat_send rejects with Halv's exact humanized
    ChatGPT HTTP 429 usage-limit message.

  proxy-error
    Headroom is in the paused-restarts error state and chat_send rejects with a
    transient proxy connection error.

  paywall
    Signed-in account without an active Halv subscription.

  Examples:
    /ux-audit.html
    /ux-audit.html?scenario=fresh
    /ux-audit.html?scenario=usage-limit
    /ux-audit.html?scenario=proxy-error
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halv UX Audit</title>
    <script>
      (function () {
        var key = "halv.theme";
        var preference = "system";
        try {
          var stored = window.localStorage.getItem(key);
          if (stored === "light" || stored === "dark" || stored === "system") {
            preference = stored;
          }
        } catch (_) {
          preference = "system";
        }
        var systemDark = window.matchMedia
          ? window.matchMedia("(prefers-color-scheme: dark)").matches
          : true;
        var resolved = preference === "system" ? (systemDark ? "dark" : "light") : preference;
        var root = document.documentElement;
        root.classList.add("theme-loading");
        root.classList.toggle("dark", resolved === "dark");
        root.dataset.themePreference = preference;
        root.dataset.theme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/harness/entry.ts"></script>
  </body>
</html>
