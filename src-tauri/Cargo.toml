[package]
name = "halv"
version = "0.8.2"
description = "Halv desktop app"
authors = ["Halv"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.77"

[lib]
name = "halv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
# The sealed secret file on Windows (src/secret_store.rs). snow already builds it.
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
futures-util = "0.3"
flate2 = "1"
halv-supervisor = { path = "supervisor" }
halv-remote = { path = "../crates/halv-remote", features = ["host"] }
keyring = { version = "3.6.3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "linux-native-sync-persistent",
    "crypto-rust",
    "vendored",
] }
portable-pty = "0.9.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.9.4"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tar = "0.4"
tauri = { version = "2", features = ["image-png", "tray-icon", "macos-private-api", "unstable"] }
tauri-plugin-dialog = "2.0.0-rc.8"
tauri-plugin-notification = "2.0.0-rc.5"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = "0.27"
toml = "0.9.12"
url = "2.5.8"
zeroize = "1.8.2"

[dev-dependencies]
halv-remote = { path = "../crates/halv-remote", features = ["host", "testing"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
notify-rust = "4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
