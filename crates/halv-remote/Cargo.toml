[package]
name = "halv-remote"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
description = "Halv remote protocol: keys, pairing offers, Noise handshakes, framing, messages, and the host and client engines"
publish = false

[lib]
name = "halv_remote"
path = "src/lib.rs"

# The default feature set is pure Rust, so the crate builds for iOS and Android.
# The network features use rustls with ring. They never pull aws-lc-rs or native-tls.
[features]
default = []
# The host engine of the desktop gateway.
host = ["__net"]
# The client engine of the phone.
client = ["__net"]
# testing::MockRelay and the in-memory host parts, for tests only.
testing = ["host", "client", "dep:httparse", "tokio/io-util"]
# Internal: the WebSocket connection code that the engines share.
__net = [
    "dep:futures-util",
    "dep:rustls",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:webpki-roots",
]

[dependencies]
base64 = "0.22.1"
ciborium = "0.2.2"
ed25519-dalek = "2.2.0"
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"], optional = true }
getrandom = "0.3.4"
hkdf = "0.12.4"
httparse = { version = "1.10.1", optional = true }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.149"
sha2 = "0.10.9"
# The snow "std" feature also turns on the optional "ring" dependency.
# ring needs a C toolchain for each mobile target, so the crate keeps it off.
snow = { version = "0.10.0", default-features = false, features = [
    "use-curve25519",
    "use-chacha20poly1305",
    "use-blake2",
    "use-getrandom",
] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false, features = ["macros", "net", "rt", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-webpki-roots"], optional = true }
webpki-roots = { version = "1.0.8", optional = true }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1.8.2", features = ["derive"] }

# The engine and relay tests need the mock relay.
[[test]]
name = "engines"
required-features = ["testing"]

[[test]]
name = "mock_relay"
required-features = ["testing"]

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
