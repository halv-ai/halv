version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Each pending major is its own PR and stays open until its migration
    # lands. With a limit of 2, the majors alone could fill every slot and
    # keep the grouped minor/patch PR from opening.
    open-pull-requests-limit: 10
    groups:
      # Majors (React, Tailwind, TypeScript, Vite...) need their own
      # migration, so they come as separate PRs and do not hold back the
      # minor and patch updates.
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      cargo-app:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /crates/halv-remote
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      # Majors (crypto, tungstenite, base64, getrandom) come as separate PRs:
      # they need interop testing with the relay and the phone app.
      cargo-remote:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # pnpm/action-setup v6.1.0 bootstraps pnpm 11.25.0 and then fails to switch
      # to the pinned 11.0.9 on macos-15-intel (ERR_PNPM_PNPM_ENGINE_IDENTITY_UNVERIFIABLE
      # for @pnpm/exe.darwin-x64). Keep v6.0.9 until a fixed release ships.
      - dependency-name: pnpm/action-setup
        versions: ["6.1.0"]
