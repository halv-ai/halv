version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      cargo-app:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /crates/halv-remote
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      cargo-remote:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # pnpm/action-setup v6.1.0 bootstraps pnpm 11.25.0 and then fails to switch
      # to the pinned 11.0.9 on macos-15-intel (ERR_PNPM_PNPM_ENGINE_IDENTITY_UNVERIFIABLE
      # for @pnpm/exe.darwin-x64). Keep v6.0.9 until a fixed release ships.
      - dependency-name: pnpm/action-setup
        versions: ["6.1.0"]
