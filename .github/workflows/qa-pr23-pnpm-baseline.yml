name: QA PR23 pnpm setup baseline

# Temporary QA workflow (qa-halv, card t_0d2920ee). Compares pnpm/action-setup
# v6.0.9 (main) with v6.1.0 (PR #23) on the 4 release runners. No secrets.

on:
  push:
    branches:
      - qa/pr23-pnpm-baseline

permissions:
  contents: read

jobs:
  pnpm-setup:
    name: pnpm ${{ matrix.action }} ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-15, macos-15-intel, ubuntu-22.04, windows-2025]
        action: [old-v6.0.9, new-v6.1.0]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm v6.0.9 (main)
        if: matrix.action == 'old-v6.0.9'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.9
          run_install: false

      - name: Setup pnpm v6.1.0 (PR #23)
        if: matrix.action == 'new-v6.1.0'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.0.9
          run_install: false

      - name: Report pnpm
        shell: bash
        run: |
          which pnpm
          pnpm --version
          test "$(pnpm --version)" = "11.0.9"
