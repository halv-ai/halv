name: Dev PR23 pnpm setup validation

# Temporary validation workflow (dev-halv, card t_70f89bc5). Runs the release
# toolchain setup from the fixed PR (pnpm/action-setup v6.0.9 + setup-node
# v7.1.0 with pnpm cache) on the 4 release runners. No secrets, no release.

on:
  push:
    branches:
      - dev/pr23-validate-pnpm-setup

permissions:
  contents: read

jobs:
  pnpm-setup:
    name: release setup ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-15, macos-15-intel, ubuntu-22.04, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Report pnpm
        shell: bash
        run: |
          which pnpm
          pnpm --version
          test "$(pnpm --version)" = "11.0.9"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
