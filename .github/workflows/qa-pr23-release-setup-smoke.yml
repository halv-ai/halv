name: QA PR23 release setup smoke

# Temporary QA workflow (qa-halv, card t_0d2920ee). Runs on this QA branch only.
# It copies the setup steps of build-artifacts from build.yml (PR #23 SHAs) on
# the 4 release runners, without the Headroom cache (forces the setup-uv path),
# without environment, secrets, signing, cache save, release or dispatch.

on:
  push:
    branches:
      - qa/pr23-release-setup-smoke

permissions:
  contents: read

jobs:
  release-setup:
    name: Release setup ${{ matrix.target }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preserve LF in immutable Headroom checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout immutable Headroom fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: halv-ai/headroom
          ref: 284912cf4f65de8f6084b2a2fbffefcd85b6b1ca
          fetch-depth: 0
          path: .headroom-source
          persist-credentials: false

      - name: Setup uv for frozen Headroom
        id: setup-uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Report uv
        shell: bash
        env:
          UV_VERSION_OUT: ${{ steps.setup-uv.outputs.uv-version }}
          CACHE_HIT: ${{ steps.setup-uv.outputs.cache-hit }}
        run: |
          echo "setup-uv output uv-version=$UV_VERSION_OUT cache-hit=$CACHE_HIT"
          uv --version
          test "$(uv --version | awk '{print $2}')" = "0.11.28"

      - name: Install uv-managed Python for frozen Headroom
        env:
          UV_PYTHON_PREFERENCE: only-managed
          UV_PYTHON_DOWNLOADS: automatic
        run: uv python install 3.12.7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.0.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Report toolchain
        shell: bash
        run: |
          node --version
          pnpm --version
          test "$(pnpm --version)" = "11.0.9"
          node --version | grep -q '^v22\.'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frozen Headroom runtime from the pinned fork
        env:
          UV_PYTHON_PREFERENCE: only-managed
          UV_PYTHON_DOWNLOADS: automatic
        run: >-
          node scripts/build-headroom-runtime.mjs
          --source .headroom-source
          --target ${{ matrix.target }}
          --ephemeral

      - name: Smoke-test frozen first-request Responses compression
        run: >-
          python scripts/smoke-headroom-runtime.py
          src-tauri/resources/headroom-runtime

      - name: Write Headroom runtime file manifests (unsigned)
        shell: bash
        env:
          HALV_SIGN_HEADROOM: "0"
        run: node scripts/sign-headroom-runtime.mjs
